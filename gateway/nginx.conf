worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS interno do Docker: os IP são reavaliados quando um contentor é recriado
    resolver 127.0.0.11 valid=10s;

    upstream users {
        zone upstreams 256k;
        server users:8000 resolve;
    }

    upstream catalog {
        zone upstreams;
        server catalog:8000 resolve;
    }

    upstream orders {
        zone upstreams;
        server orders:8000 resolve;
    }

    upstream payments {
        zone upstreams;
        server payments:8000 resolve;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # As rotas /internal/ só são acessíveis na rede interna do Docker.
        # Tem de ser o primeiro bloco regex: é o primeiro a corresponder que ganha.
        location ~* (^|/)internal(/|$) {
            return 404;
        }

        # Endpoints técnicos de cada serviço: /api/<serviço>/{health,docs,openapi.json}
        location ~ ^/api/(users|catalog|orders|payments)/(health|docs|openapi\.json)$ {
            proxy_pass http://$1/$2$is_args$args;
        }

        location /api/auth/ {
            proxy_pass http://users/auth/;
        }

        location /api/users/ {
            proxy_pass http://users/users/;
        }

        location /api/catalog/ {
            proxy_pass http://catalog/;
        }

        location = /api/orders {
            proxy_pass http://orders/orders;
        }

        location /api/orders/ {
            proxy_pass http://orders/orders/;
        }

        location = /api/payments {
            proxy_pass http://payments/payments;
        }

        location /api/payments/ {
            proxy_pass http://payments/payments/;
        }

        # Healthcheck do próprio gateway
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
